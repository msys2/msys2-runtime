name: build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: setup-msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: msys2-devel base-devel autotools cocom diffutils gcc gettext-devel libiconv-devel make mingw-w64-cross-crt mingw-w64-cross-gcc mingw-w64-cross-zlib perl zlib-devel xmlto docbook-xsl libzstd-devel

      - name: Build
        shell: msys2 {0}
        run: |
          (cd winsup && ./autogen.sh)
          ./configure --disable-dependency-tracking --with-msys2-runtime-commit="$GITHUB_SHA"
          make -j8

      - name: Install
        shell: msys2 {0}
        run: |
          make DESTDIR="$(pwd)"/_dest install

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: install
          path: _dest/

      - name: Build test programs
        shell: msys2 {0}
        run: |
          make -C x86_64-pc-cygwin/winsup/testsuite -j8 \
            CFLAGS="-O2 -pipe -ggdb -std=gnu99 -w" check_programs

      - name: Bundle up worktree
        shell: msys2 {0}
        run: $WINDIR/system32/tar.exe -czf wt.tgz --exclude _dest --exclude .git --exclude wt.tgz .

      - name: Upload worktree archive
        uses: actions/upload-artifact@v7
        with:
          name: wt.tgz
          path: wt.tgz

  generate-msys2-tests-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        uses: msys2/msys2-tests/gha-matrix-gen@main

  layer-reexec:
    needs: [build]
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Download msys2-runtime artifact
        uses: actions/download-artifact@v8
        with:
          name: install
          path: install

      - name: Check fork from a Server 2019 image layer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Start-Service docker
          $fixture = Join-Path $env:RUNNER_TEMP layer-fixture
          $overlay = Join-Path $env:RUNNER_TEMP layer-overlay
          New-Item -ItemType Directory $fixture, $overlay | Out-Null
          $sfx = Join-Path $env:RUNNER_TEMP msys2-base.sfx.exe
          $pkg = Join-Path $env:RUNNER_TEMP msys2-runtime.pkg.tar.zst
          $installer = 'https://github.com/msys2/msys2-installer'
          $mirror = 'https://repo.msys2.org/msys/x86_64'
          Invoke-WebRequest -OutFile $sfx -Uri (
            "$installer/releases/download/2026-09-27/" +
            'msys2-base-x86_64-20260927.sfx.exe')
          Invoke-WebRequest -OutFile $pkg -Uri (
            "$mirror/msys2-runtime-3.6.11-3-x86_64.pkg.tar.zst")
          $sfxHash = (
            'ad336cccfda47758b5e15cda993fbba421115cb0b126697daef1ee4dfe37209f')
          $pkgHash = (
            'b6478bd1b4cb4b2e07c45db725fee93f9424c19fa248240dcb7b7f4187cd92db')
          if ((Get-FileHash $sfx).Hash -ne $sfxHash -or
              (Get-FileHash $pkg).Hash -ne $pkgHash) {
            throw 'Unexpected MSYS2 fixture checksum'
          }
          $extract = Start-Process -FilePath $sfx `
            -ArgumentList "-y -o`"$fixture`"" -Wait -PassThru
          if ($extract.ExitCode -ne 0) { throw 'MSYS2 extraction failed' }

          @'
          FROM mcr.microsoft.com/windows/servercore:ltsc2019
          COPY msys64 C:/msys64
          '@ | Set-Content "$fixture\Dockerfile"
          docker build --isolation=hyperv -t layer-fixture $fixture
          @'
          FROM layer-fixture
          COPY msys-2.0.dll C:/msys64/usr/bin/msys-2.0.dll
          '@ | Set-Content "$overlay\Dockerfile"

          function Test-LayerFork($dll, $expected) {
            Copy-Item $dll "$overlay\msys-2.0.dll"
            docker build --isolation=hyperv -t layer-probe $overlay
            # Bash must be the entry process, with nothing reading its DLL
            # through the container volume before it starts.
            $PSNativeCommandUseErrorActionPreference = $false
            $probe = 'for ((i=0;i<100;i++)); do ' +
              'x=$(echo ok) && [[ $x = ok ]] || exit 1; done; exit 7'
            $output = docker run --rm --isolation=hyperv -e MSYSTEM=MSYS `
              layer-probe 'C:\msys64\usr\bin\bash.exe' --noprofile --norc `
              -c $probe 2>&1
            $status = $LASTEXITCODE
            $output | Out-Host
            Write-Host "Fork probe: expected $expected, exited $status"
            if ($expected -eq 'fork error') {
              $forkError = ($output -join "`n") -match
                'child_copy:.*Win32 error 299'
              if (!$status -or $status -eq 7 -or !$forkError) {
                throw "Control did not reproduce the fork failure"
              }
            } elseif ($status -ne 7) {
              throw "Expected the fork probe to exit 7; got $status"
            }
          }

          $path = $env:PATH
          $env:PATH = "$fixture\msys64\usr\bin;$path"
          $cygpath = "$fixture\msys64\usr\bin\cygpath.exe"
          $pkgUnix = & $cygpath -u $pkg
          $fixtureUnix = & $cygpath -u $fixture
          & "$fixture\msys64\usr\bin\tar.exe" -xf $pkgUnix `
            -C $fixtureUnix usr/bin/msys-2.0.dll
          $env:PATH = $path
          Test-LayerFork "$fixture\usr\bin\msys-2.0.dll" 'fork error'
          Test-LayerFork 'install\usr\bin\msys-2.0.dll' 'success'
          exit 0

  msys2-tests:
    needs: [build, generate-msys2-tests-matrix]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-msys2-tests-matrix.outputs.matrix) }}

    name: msys2-tests ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      FC: ${{ matrix.fc }}
    steps:
      - id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: ${{ matrix.packages }}

      - name: Add staging repo
        shell: msys2 {0}
        run: |
          sed -i '1s|^|[staging]\nServer = https://repo.msys2.org/staging/\nSigLevel = Never\n|' /etc/pacman.conf

      - name: Update using staging
        shell: pwsh
        run: |
          msys2 -c 'pacman --noconfirm -Suuy'
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          msys2 -c 'pacman --noconfirm -Suu'

      - name: Download msys2-runtime artifact
        uses: actions/download-artifact@v8
        with:
          name: install
          path: ${{ steps.msys2.outputs.msys2-location }}

      - name: uname -a
        shell: msys2 {0}
        run: uname -a

      - name: Avoid Rust DLL base collisions
        if: matrix.msystem == 'MSYS' && matrix.type != 'docker'
        shell: msys2 {0}
        run: |
          # The output path changes ld's automatically generated DLL bases.
          echo 'CARGO_TARGET_DIR=/tmp/cargo-target' >> "$GITHUB_ENV"

      - name: Run tests
        uses: msys2/msys2-tests@main

  cygwin-tests:
    needs: [build]
    runs-on: windows-latest
    steps:
      - name: setup-msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS
          update: true
          install: msys2-devel base-devel diffutils make perl busybox cygutils

      - name: Remove inherited permissions
        shell: pwsh
        run: |
          # Remove inherited ACEs before extracting the POSIX mode tests.
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          icacls . /inheritance:r
          icacls . /grant Administrators:F

      - name: Download worktree archive
        uses: actions/download-artifact@v7
        with:
          name: wt.tgz

      - name: Extract worktree
        shell: msys2 {0}
        run: $WINDIR/system32/tar.exe -xzf wt.tgz

      - name: Run the test suite of Cygwin
        shell: msys2 {0}
        run: >-
          export PATH=/usr/bin:$WINDIR/system32 &&
          export MAKEFLAGS=-j8 &&
          export MSYS=winsymlinks:native &&
          WINSUP=$PWD/x86_64-pc-cygwin/winsup &&
          mkdir -p "$WINSUP/testsuite/testinst/etc" &&
          test_root=$(cygpath -m "$WINSUP/testsuite/testinst") &&
          fstab=$WINSUP/testsuite/testinst/etc/fstab &&
          printf '%s / auto acl,override 0 0\n' "$test_root" > "$fstab" &&
          printf 'none / cygdrive acl,posix=0 0 0\n' >> "$fstab" &&
          cp $WINSUP/cygserver/cygserver.exe $WINSUP/testsuite/testinst/usr/bin/ &&
          (cd $WINSUP/testsuite/testinst/usr/bin &&
           PATH=$PWD:$WINDIR/system32
           pwsh_exe="/c/Program Files/PowerShell/7/pwsh.exe"
           "$pwsh_exe" -command '& .\cygserver.exe' &) &&
          (cd $WINSUP && make check AM_COLOR_TESTS=always)

      - name: Upload testsuite logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cygwin-testsuite-logs
          path: |
            x86_64-pc-cygwin/winsup/testsuite/**/*.log
            x86_64-pc-cygwin/winsup/testsuite/**/*.trs
